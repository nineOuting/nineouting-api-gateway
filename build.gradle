plugins {
    id 'java'
    // Spring Cloud Gateway가 아직 Boot 4.1을 정식 지원하지 않아(2026.0은 마일스톤) gateway만 4.0.x를 쓴다.
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nineouting.backend'
version = '0.0.1'

ext {
    commonVersion = '0.2.0'
    springCloudVersion = '2025.1.3'
    jjwtVersion = '0.12.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // 공통 모듈(nineouting-common) — GitHub Packages는 public이어도 읽을 때 토큰이 필요하다.
    maven {
        url = uri('https://maven.pkg.github.com/nineOuting/nineouting-common')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
            password = System.getenv('GPR_TOKEN') ?: findProperty('gpr.key')
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // ApiResponse·에러 코드만 쓴다 (web-common의 예외 처리 자동 설정은 서블릿 전용이라 켜지지 않는다)
    implementation "com.nineouting.backend:web-common:${commonVersion}"
    implementation "com.nineouting.backend:observability:${commonVersion}"

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    testRuntimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    testRuntimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}
